<rect x="30.0" y="1234.0" width="860.0" height="276.0" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
<text x="48.0" y="1270.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#be123c" text-anchor="start">Puntos críticos</text>
<text x="48.0" y="1302.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1f2937" text-anchor="start">En rojo: el valor se calcula de memoria; el mismo pedido se copia</text>
<text x="48.0" y="1332.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1f2937" text-anchor="start">en recibo y en dos cuadernos; la confusión se ve tarde, en el</text>
<text x="48.0" y="1362.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1f2937" text-anchor="start">acoplado (paso 6); el cierre se suma a mano y, si no cuadra,</text>
<text x="48.0" y="1392.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1f2937" text-anchor="start">se vuelve a contar (paso 9). No hay sistema ni WhatsApp.</text>
<rect x="910.0" y="1234.0" width="860.0" height="276.0" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
<text x="928.0" y="1270.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#334155" text-anchor="start">Nota sobre roles</text>
<text x="928.0" y="1302.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1f2937" text-anchor="start">El marcado lo hace casi siempre Esperanza; en tandas grandes</text>
<text x="928.0" y="1332.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1f2937" text-anchor="start">lo hace ocasionalmente Diego. Harrison apoya el planchado</text>
<text x="928.0" y="1362.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1f2937" text-anchor="start">antes del acoplado (paso 6). El cierre de caja es de Diego.</text>
