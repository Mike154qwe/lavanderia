<text x="1230.0" y="780.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">6. Acoplado</text>
<text x="1230.0" y="816.5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#64748b" text-anchor="middle">con el recibo</text>
<rect x="1240.0" y="930.0" width="255.0" height="128.0" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
<text x="1367.5" y="970.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">9. Cierre de</text>
