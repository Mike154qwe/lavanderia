<text x="952.5" y="308.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">3. Recibo</text>
<text x="952.5" y="344.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">físico</text>
<text x="952.5" y="380.5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#64748b" text-anchor="middle">escribe a mano</text>
