<text x="1367.5" y="528.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">7. Cuaderno</text>
<text x="1367.5" y="564.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">de salidas</text>
<text x="1367.5" y="600.5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#64748b" text-anchor="middle">tacha al entregar</text>
<rect x="1515.0" y="488.0" width="240.0" height="128.0" rx="12" fill="#eaf7f0" stroke="#0f7b55" stroke-width="3"/>
<text x="1635.0" y="528.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">8. Entrega y</text>
<text x="1635.0" y="564.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">cobro</text>
<text x="1635.0" y="600.5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#64748b" text-anchor="middle">recibe el pago</text>
<rect x="830.0" y="722.0" width="245.0" height="128.0" rx="12" fill="#eaf7f0" stroke="#0f7b55" stroke-width="3"/>
<text x="952.5" y="762.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">5. Lavado y</text>
<text x="952.5" y="798.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">secado</text>
<text x="952.5" y="834.5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#64748b" text-anchor="middle">por tandas</text>
