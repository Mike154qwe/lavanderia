<text x="434.0" y="308.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">1. Recepción</text>
<text x="434.0" y="344.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">y clasificación</text>
<text x="434.0" y="380.5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#64748b" text-anchor="middle">marca la prenda</text>
<rect x="565.0" y="268.0" width="245.0" height="128.0" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
<text x="687.5" y="308.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">2. Cálculo del</text>
<text x="687.5" y="344.5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1f2937" text-anchor="middle">valor</text>
<text x="687.5" y="380.5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#64748b" text-anchor="middle">de memoria</text>
